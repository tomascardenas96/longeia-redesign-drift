<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Longeia | Centro de Bienestar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <header>
      <nav></nav>

    <main>
      <section id="hero">
        <div class="hero__container">
          <div class="eyebrown">SALUD · BIENESTAR · ACOMPAÑAMIENTO</div>
          <h1>Longeia</h1>
          <div class="hero__services-gallery"></div>
          <p class="hero__subtitle">
            Recursos para cuidarte mejor, de forma simple y profesional. Listos
            para descargar.
          </p>
          <div class="hero__icons-container">
            <!-- Icono de Email -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              class="icon"
            >
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m2 7 10 6 10-6"></path>

            <!-- Icono de Tik Tok -->
            <svg viewBox="0 0 24 24" fill="currentColor" class="icon">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              class="icon"
            >
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle
                cx="17.5"
                cy="6.5"
                r="1"
                fill="currentColor"
                stroke="none"
              ></circle>
            </svg>

            <!-- Icono de Whatsapp -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="icon"

              <path
